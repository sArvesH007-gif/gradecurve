<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d16"><title>GradeCurve — Relative grading, made clear</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--bg:#090d16;--panel:#111725;--panel2:#151e2e;--line:#ffffff12;--text:#eef2ff;--muted:#93a0b8;--violet:#9b7bff;--cyan:#30c7dc;--green:#35d39a;--amber:#f7ad5b;--red:#ff7388}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 65% -25%,#252041 0%,transparent 50%),var(--bg);color:var(--text);font:15px 'DM Sans',sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.mono{font-family:'Space Mono',monospace}.muted{color:var(--muted)}.wrap{max-width:1240px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:15px 0}.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px}.mark{width:32px;height:32px;border-radius:11px;background:linear-gradient(145deg,#9775ff,#45cadd);display:grid;place-items:center;color:white;font-weight:700}.nav{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#ffffff08;color:var(--text);padding:10px 15px;border-radius:10px;transition:.2s}.btn:hover{border-color:#987eff88;background:#8b5cf622;transform:translateY(-1px)}.primary{background:linear-gradient(120deg,#7858e9,#9a67e8);border:0;color:#fff;font-weight:600}.card{background:linear-gradient(145deg,#ffffff0b,#ffffff04);border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:0 18px 45px #0002;backdrop-filter:blur(16px)}.hero{padding:74px 0 42px;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}.eyebrow{color:#b9a8ff;letter-spacing:.12em;text-transform:uppercase;font-size:11px;font-weight:700}.hero h1{font-size:clamp(40px,5vw,67px);letter-spacing:-.05em;line-height:1.05;margin:16px 0}.hero p{color:#adb7ca;line-height:1.75;max-width:550px}.hero-actions{display:flex;gap:12px;margin-top:26px}.preview{position:relative;padding:28px;min-height:320px}.preview:before{content:'';position:absolute;inset:-1px;border-radius:20px;background:linear-gradient(135deg,#8b5cf633,transparent 55%,#06b6d422);pointer-events:none}.preview-head{display:flex;justify-content:space-between;position:relative}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px;position:relative}.metric{background:#090e19aa;border:1px solid var(--line);padding:15px;border-radius:13px}.metric small,.kpi small{color:var(--muted);display:block;font-size:12px}.metric strong{display:block;font-size:22px;margin-top:8px}.section-title{font-size:22px;margin:12px 0 20px}.feature-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0}.feature-row .card{padding:20px}.disclaimer{border-top:1px solid var(--line);padding:22px 0;color:#78859c;font-size:12px;text-align:center}.login{max-width:460px;margin:70px auto}.login h1{font-size:32px;letter-spacing:-.04em}.tabs{display:flex;background:#0b101b;padding:4px;border-radius:11px;margin:22px 0}.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:11px;border-radius:8px}.tabs button.active{background:#222039;color:white}.field{margin:14px 0}.field label{display:block;font-size:12px;color:#b6c0d1;margin-bottom:7px}.field input,.field select{width:100%;background:#090e19;border:1px solid var(--line);border-radius:9px;padding:12px;color:white;outline:none}.field input:focus,.field select:focus{border-color:var(--violet);box-shadow:0 0 0 3px #8b5cf522}.full{width:100%;margin-top:10px}.err{color:#ff9cae;min-height:20px;font-size:13px}.appgrid{display:grid;grid-template-columns:220px 1fr;gap:24px;margin-top:28px}.sidebar{padding:14px;align-self:start;position:sticky;top:20px}.sideitem{display:block;text-align:left;width:100%;padding:12px;background:transparent;color:#aab4c7;border:0;border-radius:9px;margin:3px 0}.sideitem.active,.sideitem:hover{background:#8b5cf61a;color:#d5c8ff}.content{min-width:0}.welcome{display:flex;justify-content:space-between;align-items:center;margin:6px 0 22px}.welcome h1{margin:4px 0;font-size:29px;letter-spacing:-.035em}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi strong{display:block;font-size:26px;margin-top:10px}.kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.course{margin-top:15px}.course-head{display:flex;justify-content:space-between;align-items:center}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:6px 9px;background:#ffffff0a;border:1px solid var(--line);border-radius:8px;font-size:11px;color:#bec7d9}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:500}td input{width:95px;background:#090e19;color:white;border:1px solid var(--line);border-radius:7px;padding:8px}.status{padding:5px 8px;border-radius:20px;font-size:11px;background:#ffffff0b}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.bar{height:7px;background:#ffffff12;border-radius:9px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:9px}.inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.inline select,.inline input{background:#090e19;color:white;border:1px solid var(--line);border-radius:8px;padding:9px}.hidden{display:none!important}.notice{position:fixed;bottom:22px;right:22px;background:#172033;border:1px solid var(--line);padding:14px 18px;border-radius:12px;box-shadow:0 10px 40px #0008;z-index:10}.login-note{font-size:12px;line-height:1.8;color:var(--muted);margin-top:18px}.viz{height:190px;display:flex;align-items:end;gap:5px;padding:15px 0 24px;position:relative}.viz span{flex:1;border-radius:5px 5px 1px 1px;background:linear-gradient(0deg,#805be7,#42bed3);opacity:.72;min-width:5px}.viz b{position:absolute;bottom:0;font-size:10px;color:var(--muted);font-weight:400}.splitline{height:1px;background:var(--line);margin:15px 0}.footnote{color:#78859c;font-size:11px;line-height:1.6;margin-top:18px}@media(max-width:850px){.hero{grid-template-columns:1fr;gap:25px;padding-top:42px}.appgrid{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:4px;padding:7px}.sideitem{white-space:nowrap;width:auto}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:16px}.nav{gap:4px}.nav .btn{padding:8px;font-size:12px}.hero{padding-top:35px}.hero-actions{flex-wrap:wrap}.feature-row,.grid2{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr 1fr}.kpis{gap:8px}.kpi{padding:15px}.kpi strong{font-size:22px}.welcome{align-items:flex-start;gap:8px}.welcome h1{font-size:25px}.hide-mobile{display:none}}
</style></head><body><main id="root"></main><div id="toast" class="notice hidden" role="status"></div><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); async function api(path,body){let r=await fetch(path,{method:body!==undefined&&body!==null?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}let appData=null,active='Overview';
function landing(){return `<div class="wrap"><header class="top"><div class="brand"><span class="mark">g</span> GradeCurve</div><div class="nav"><button class="btn" onclick="login('student')">Student Login</button><button class="btn primary" onclick="login('teacher')">Teacher Login</button></div></header><section class="hero"><div><div class="eyebrow">Relative grading analytics</div><h1>Know where you stand.<br><span style="color:#b29cff">Know what you need next.</span></h1><p>Understand your progress in context. GradeCurve helps students see how their work compares with their class, while faculty can spot students who may need support.</p><div class="hero-actions"><button class="btn primary" onclick="login('student')">Student Login →</button><button class="btn" onclick="login('teacher')">Teacher Login →</button></div></div><div class="card preview"><div class="preview-head"><div><div class="eyebrow">Course snapshot · CSE1007</div><div style="font-size:19px;font-weight:600;margin-top:7px">DBMS · L31+L32</div></div><span class="status green">On Track</span></div><div class="metric-grid"><div class="metric"><small>Class Mean</small><strong>34.8</strong></div><div class="metric"><small>Standard Deviation</small><strong>8.6</strong></div><div class="metric"><small>Student Z-Score</small><strong class="mono" style="color:var(--cyan)">+0.82</strong></div><div class="metric"><small>Grade Trajectory</small><strong style="font-size:16px;color:var(--green)">B/C · On Track</strong></div></div><div class="splitline"></div><div class="inline"><span class="muted" style="font-size:12px">Target FAT score</span><strong class="mono">68 / 100</strong><span class="muted" style="font-size:11px;margin-left:auto">Simulation preview</span></div></div></section><h2 class="section-title">A clearer view of progress</h2><div class="feature-row"><div class="card"><div class="eyebrow">01 · Context</div><h3>Relative by design</h3><p class="muted">Compare assessment results with the same course and slot, using transparent class statistics.</p></div><div class="card"><div class="eyebrow">02 · Planning</div><h3>Useful projections</h3><p class="muted">Explore target trajectories and estimate what may be needed in upcoming assessments.</p></div><div class="card"><div class="eyebrow">03 · Support</div><h3>Timely guidance</h3><p class="muted">Give faculty a practical view of class health, pending marks, and students needing a check-in.</p></div></div><footer class="disclaimer">GradeCurve provides analytical trajectories and simulations. Official grades remain determined by institutional policy.</footer></div>`}
function login(role='student'){window.role=role;$('#root').innerHTML=`<div class="wrap"><header class="top"><div class="brand" onclick="home()" style="cursor:pointer"><span class="mark">g</span> GradeCurve</div><button class="btn" onclick="home()">← Back</button></header><section class="card login"><div class="eyebrow">Welcome to GradeCurve</div><h1>Sign in to your workspace</h1><p class="muted">Use the account credentials configured by your administrator.</p><div class="tabs"><button id="studentTab" class="${role==='student'?'active':''}" onclick="login('student')">Student Login</button><button id="teacherTab" class="${role==='teacher'?'active':''}" onclick="login('teacher')">Teacher Login</button></div><form onsubmit="event.preventDefault();doLogin()"><div class="field"><label for="username">${role==='student'?'Registration number':'Email address'}</label><input id="username" autocomplete="username" value="${role==='student'?'24BCE0001':'dr.sharma@gradecurve.demo'}" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><div class="err" id="error"></div><button class="btn primary full">Continue →</button></form><div class="login-note">Demo accounts<br>Student: <span class="mono">24BCE0001</span><br>Teacher: <span class="mono">dr.sharma@gradecurve.demo</span></div></section></div>`}
async function doLogin(){try{await api('/api/login',{username:$('#username').value,password:$('#password').value,role:window.role});await boot()}catch(e){$('#error').textContent=e.message}}
function navItems(){return appData.user.role==='student'?['Overview','Course Analytics','Target Predictor','Study Matchmaker','Fallback Mark Entry','Profile']:['Overview','Class Roster','Batch Mark Entry','Verification Queue','At-Risk Students','Course Analytics']}
async function boot(){try{appData=await api('/api/dashboard');renderApp()}catch(e){home()}}
async function renderApp(){let teacher=appData.user.role==='teacher';let page=await (teacher?teacherPage():studentPage());$('#root').innerHTML=`<div class="wrap"><header class="top"><div class="brand"><span class="mark">g</span> GradeCurve <span class="muted hide-mobile" style="font-size:12px;font-weight:400">${teacher?'Faculty workspace':'Student workspace'}</span></div><div class="inline"><span class="muted hide-mobile">${esc(appData.user.name)}</span><button class="btn" onclick="logout()">Sign out</button></div></header><div class="appgrid"><aside class="card sidebar">${navItems().map(n=>`<button class="sideitem ${active===n?'active':''}" onclick="active='${n}';renderApp()">${n==='Overview'?'◈':n==='Target Predictor'?'⌁':n==='Verification Queue'?'✓':'·'} &nbsp; ${n}</button>`).join('')}</aside><section class="content">${page}</section></div><footer class="footnote">Grade trajectories are analytical estimates, not official university grades. Assessment outcomes follow institutional policy.</footer></div>`;if(active==='Target Predictor')setTimeout(updateProjection,0)}
function trajectoryTone(t){return t.includes('Needs')?'red':t.includes('S Grade')||t.includes('A Grade')||t==='On Track'?'green':'amber'}
async function studentPage(){let p=appData.profile,courses=appData.courses;let marks=courses.flatMap(c=>c.components).filter(x=>x.mark!==null),zs=marks.map(x=>x.z).filter(x=>x!==null),z=zs.length?zs.reduce((a,b)=>a+b,0)/zs.length:0,attendance=p.attendance;let rank=Math.round(50+z*17);if(active==='Course Analytics')return `<div class="welcome"><div><div class="eyebrow">Detailed performance</div><h1>Course analytics</h1><p class="muted">Marks and relative Z-scores by assessment, from your active class section.</p></div></div>${courses.map(c=>`<div class="card course"><div class="eyebrow">${esc(c.code)}</div><h3>${esc(c.name)}</h3><div class="table-wrap"><table><thead><tr><th>Component</th><th>Your mark</th><th>Class mean</th><th>Z-score</th><th>Trajectory</th></tr></thead><tbody>${c.components.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.mark??'Pending'}</td><td>${x.mean??'?'}</td><td class="mono">${x.z===null?'?':(x.z>=0?'+':'')+x.z}</td><td><span class="status ${trajectoryTone(x.trajectory)}">${esc(x.trajectory)}</span></td></tr>`).join('')}</tbody></table></div></div>`).join('')}`;if(active==='Target Predictor'){setTimeout(updateProjection,0);return predictor();}if(active==='Fallback Mark Entry')return fallbackPage();if(active==='Study Matchmaker')return matchPage();if(active==='Profile')return `<div class="welcome"><div><div class="eyebrow">Your account</div><h1>Profile</h1></div></div><div class="card"><h3>${esc(appData.user.name)}</h3><p class="mono">${esc(p.reg_no)} · ${esc(p.slot)}</p><p class="muted">Current semester · Fall 2026</p></div>`;return `<div class="welcome"><div><div class="eyebrow">Student overview · Fall 2026</div><h1>Good morning, ${esc(appData.user.name.split(' ')[0])}</h1><div class="muted">Registration <span class="mono">${esc(p.reg_no)}</span> · Slot ${esc(p.slot)}</div></div><span class="status green">● Your data is current</span></div><div class="kpis"><div class="card kpi"><small>Current relative position</small><strong class="${z<0?'amber':''}">${z>=0?'Above':'Near'} average</strong><div class="sub">Across enrolled courses</div></div><div class="card kpi"><small>Overall Z-score</small><strong class="mono">${z>=0?'+':''}${z.toFixed(2)}</strong><div class="sub">Based on available marks</div></div><div class="card kpi"><small>Projected trajectory</small><strong class="${trajectoryTone(grading(z))}">${grading(z)}</strong><div class="sub">Analytical estimate</div></div><div class="card kpi"><small>Attendance</small><strong>${attendance}%</strong><div class="bar"><i style="width:${attendance}%"></i></div></div></div><div class="grid2"><div class="card"><div class="course-head"><div><div class="eyebrow">Class distribution</div><h3>Score context</h3></div><span class="chip">${esc(p.slot)}</span></div><div class="viz">${[10,18,33,53,75,91,76,57,38,21,11,5,2].map((v,i)=>`<span style="height:${v}%"></span>`).join('')}<b style="left:4%">Lower scores</b><b style="right:4%">Higher scores</b></div></div><div class="card"><div class="eyebrow">Relative position</div><h3>Across your classes</h3><div class="inline" style="justify-content:space-between;margin:26px 0"><div><span class="muted">Percentile</span><div style="font-size:32px;font-weight:700">${Math.max(5,Math.min(95,rank))}<small style="font-size:14px">th</small></div></div><div><span class="muted">Attendance</span><div style="font-size:32px;font-weight:700;color:${attendance<75?'var(--amber)':'var(--green)'}">${attendance}%</div></div></div><div class="bar"><i style="width:${Math.max(5,Math.min(95,rank))}%"></i></div><p class="muted" style="font-size:12px">Position is calculated from seeded class assessment results.</p></div></div>${courses.map(c=>`<div class="card course"><div class="course-head"><div><div class="eyebrow">${esc(c.code)}</div><h3 style="margin:6px 0">${esc(c.name)}</h3></div><button class="btn" onclick="active='Course Analytics';renderApp()">Explore →</button></div><div class="chips">${c.components.map(x=>`<span class="chip">${esc(x.name)} · ${x.mark===null?'—':x.mark} ${x.z===null?'':`· Z ${x.z>=0?'+':''}${x.z}`}</span>`).join('')}</div></div>`).join('')}`}
function grading(z){return z>=1.5?'S Grade Trajectory':z>=1?'A Grade Trajectory':z>=0?'On Track':'Needs Focus'}
function predictor(){let c=appData.courses[0],vals=c.components.filter(x=>x.mark!==null),mean=vals.length?vals.reduce((a,x)=>a+x.mean,0)/vals.length:0,sd=6,target='A';return `<div class="welcome"><div><div class="eyebrow">Plan your next step</div><h1>Target grade predictor</h1><p class="muted">Estimate a future FAT score using current class statistics.</p></div></div><div class="card"><div class="inline"><label for="target">Trajectory target</label><select id="target" onchange="updateProjection()"><option>S</option><option selected>A</option><option>B</option><option>C</option></select><label style="margin-left:12px" for="difficulty">What-if exam difficulty <span id="diffLabel">0%</span></label><input id="difficulty" type="range" min="-15" max="15" value="0" oninput="updateProjection()" style="accent-color:#9b7bff"></div><div class="grid2"><div><div class="eyebrow" style="margin-top:30px">Required FAT score</div><div id="required" style="font-size:46px;font-weight:700;margin-top:7px">—</div><div id="attainability" class="muted">Select a target to simulate</div></div><div><div class="metric-grid"><div class="metric"><small>Baseline Mean</small><strong id="baseMean">${mean.toFixed(1)}</strong></div><div class="metric"><small>Adjusted Mean</small><strong id="adjustedMean">${mean.toFixed(1)}</strong></div></div><div class="bar"><i id="projectbar" style="width:0%"></i></div><p class="muted" style="font-size:12px">Projection adjusts upcoming class mean by your selected difficulty. Simulation only.</p></div></div></div><div class="card course"><h3>Assessment status</h3><p class="muted">${vals.filter(x=>x.name!=='FAT').length} completed components · FAT score is projected against class trajectory thresholds.</p></div>`}
function updateProjection(){let c=appData.courses[0],all=c.components,vals=all.filter(x=>x.mark!==null&&x.name!=='FAT'),fat=all.find(x=>x.name==='FAT'),d=Number($('#difficulty').value),base=fat?.mean??35,adj=base*(1+d/100),target=$('#target').value,z={S:1.5,A:1,B:0,C:-.5}[target],historicMean=vals.reduce((a,x)=>a+(x.mean/x.max_score)*100*x.weight,0),historicStudent=vals.reduce((a,x)=>a+(x.mark/x.max_score)*100*x.weight,0),fatMean=adj/fat.max_score*100*fat.weight,variance=all.reduce((a,x)=>a+Math.pow(x.sd/x.max_score*100*x.weight,2),0),targetTotal=historicMean+fatMean+z*Math.sqrt(variance),needed=((targetTotal-historicStudent)/(fat.weight*100))*fat.max_score,required=Math.max(0,needed);$('#diffLabel').textContent=(d>0?'+':'')+d+'%';$('#adjustedMean').textContent=adj.toFixed(1);$('#required').textContent=required>fat.max_score?`${fat.max_score}+`:required.toFixed(1);$('#projectbar').style.width=Math.min(100,required/fat.max_score*100)+'%';$('#attainability').textContent=needed>fat.max_score?'Target currently outside attainable range':needed<=0?'You are already above this trajectory threshold.':'Estimated FAT mark out of '+fat.max_score+' ? '+(required>fat.max_score*.85?'Stretch target':'Attainable')}
async function fallbackPage(){let list=await api('/api/all-assessments').catch(()=>[]);return `<div class="welcome"><div><div class="eyebrow">Fallback entry</div><h1>Submit a mark for review</h1><p class="muted">Student reported marks join official statistics only after teacher approval.</p></div></div><div class="card"><form onsubmit="submitMark(event)"><div class="field"><label>Assessment</label><select id="assess" onchange="$('#myMark').max=this.selectedOptions[0].dataset.max">${list.map(x=>`<option data-max="${x.max_score}" value=\"${x.id}\">${esc(x.code)} / ${esc(x.name)}</option>`).join('')}</select><small class="muted">Choose the matching assessment for your course.</small></div><div class="field"><label>Your mark</label><input id="myMark" type="number" min="0" max="${list[0]?.max_score??100}" step="0.1" required></div><div class="field"><label>Peer marks, comma separated</label><input id="peers" placeholder="28, 31, 34, 37"><small class="muted">Peer scores help flag unusual entries for review.</small></div><button class="btn primary">Send for teacher review →</button></form></div>`}
async function submitMark(e){e.preventDefault();let aid=Number($('#assess').value);try{await api('/api/submit-mark',{assessment_id:aid,score:$('#myMark').value,peers:$('#peers').value.split(',').map(x=>x.trim()).filter(Boolean)});toast('Sent to the teacher verification queue.');e.target.reset()}catch(x){toast(x.message)}}
async function matchPage(){let peers=await api('/api/peers').catch(()=>[]);return `<div class="welcome"><div><div class="eyebrow">Learn together</div><h1>Peer study matchmaker</h1><p class="muted">Strong performers in your slot can help you work through a challenging subject.</p></div></div>${peers.length?`<div class="grid2">${peers.map(x=>`<div class="card"><div class="eyebrow">Recommended peer ? ${esc(x.code)}</div><h3>${esc(x.name)}</h3><div class="mono" style="color:var(--green)">Strong class performance</div><p class="muted">${esc(x.course)} ? ${esc(appData.profile.slot)}</p><button class="btn primary" onclick="requestMatch(${x.id},${x.course_id})">Request study match ?</button></div>`).join('')}</div>`:'<div class="card"><h3>No recommendations yet</h3><p class="muted">Recommendations appear when eligible peers in your active slot have approved marks.</p></div>'}`}async function requestMatch(peer_id,course_id){try{await api('/api/match',{peer_id,course_id});toast('Study match request sent.')}catch(e){toast(e.message)}}
async function teacherPage(){if(active==='Class Roster')return rosterPage();if(active==='Batch Mark Entry')return batchPage();if(active==='Verification Queue')return verifyPage();if(active==='At-Risk Students')return risksPage();let data=appData,students=await api('/api/roster'),pending=data.pending.length,atRisk=students.filter(s=>s.attendance<75).length;return `<div class="welcome"><div><div class="eyebrow">Faculty operations · Fall 2026</div><h1>Good morning, ${esc(data.user.name)}</h1><div class="muted">Your teaching overview across assigned sections</div></div><span class="status green">● Live demo data</span></div><div class="kpis"><div class="card kpi"><small>Students</small><strong>${students.length}</strong><div class="sub">Across three active slots</div></div><div class="card kpi"><small>Courses</small><strong>${data.courses.length}</strong><div class="sub">Assigned this semester</div></div><div class="card kpi"><small>Pending verifications</small><strong class="${pending?'amber':''}">${pending}</strong><div class="sub">Student reported marks</div></div><div class="card kpi"><small>Attendance flags</small><strong class="${atRisk?'amber':''}">${atRisk}</strong><div class="sub">Below 75% attendance</div></div></div><h2 class="section-title">Slot overview</h2><div class="grid2">${data.slots.map(s=>{let group=students.filter(x=>x.slot===s.name);return `<div class="card"><div class="course-head"><div><div class="eyebrow">Active section</div><h3>${esc(s.name)}</h3></div><span class="chip">${group.length} students</span></div><div class="inline" style="justify-content:space-between;margin-top:16px"><span class="muted">Attendance watchlist</span><strong class="${group.filter(x=>x.attendance<75).length?'amber':'green'}">${group.filter(x=>x.attendance<75).length}</strong></div><div class="bar"><i style="width:${100-group.filter(x=>x.attendance<75).length/group.length*100}%"></i></div><div class="muted" style="font-size:12px;margin-top:12px">${esc(data.courses.map(c=>c.code).join(' · '))}</div></div>`}).join('')}</div><div class="card course"><div class="course-head"><h3>Needs review</h3><button class="btn" onclick="active='Verification Queue';renderApp()">Open queue →</button></div><p class="muted">${pending?`${pending} student submissions are waiting for review.`:'No pending marks right now.'}</p></div>`}
async function rosterPage(){let r=await api('/api/roster');return `<div class="welcome"><div><div class="eyebrow">Faculty workspace</div><h1>Class roster</h1><p class="muted">${r.length} students · All active slots</p></div></div><div class="card table-wrap"><table><thead><tr><th>Student</th><th>Registration</th><th>Slot</th><th>Attendance</th><th>Signal</th><th></th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.name)}</td><td class="mono">${esc(x.reg_no)}</td><td>${esc(x.slot)}</td><td>${x.attendance}%</td><td><span class="status ${x.attendance<75?'amber':'green'}">${x.attendance<75?'Attendance watch':'In range'}</span></td><td><button class="btn" onclick="sendAlert(${x.id})">Send guidance</button></td></tr>`).join('')}</tbody></table></div>`}
async function batchPage(){let assessments=await api('/api/assessments').catch(()=>[]);window.assessmentRows=assessments;let ids=[...new Set(assessments.map(x=>x.course_id))];return `<div class="welcome"><div><div class="eyebrow">Mark management</div><h1>Batch mark entry</h1></div></div><div class="card"><div class="inline"><label>Course</label><select id="bcourse" onchange="setAssessments()">${ids.map(id=>`<option value="${id}">${id===1?'CSE1004 ? Network Essentials':'CSE1007 ? DBMS'}</option>`).join('')}</select><label>Slot</label><select id="bslot"><option>L31+L32</option><option>A1</option><option>B2</option></select><label>Assessment</label><select id="bassess">${assessments.filter(a=>a.course_id===ids[0]).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><button class="btn" onclick="loadBatch()">Load marks</button></div><div id="batchTable" class="table-wrap" style="margin-top:18px">Select a course, slot, and assessment.</div><button class="btn primary" style="margin-top:16px" onclick="saveBatch()">Save marks</button></div>`}
function setAssessments(){$('#bassess').innerHTML=window.assessmentRows.filter(a=>a.course_id===Number($('#bcourse').value)).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}async function loadBatch(){let r=await api(`/api/marks?course=${$('#bcourse').value}&assessment=${$('#bassess').value}&slot=${encodeURIComponent($('#bslot').value)}`);$('#batchTable').innerHTML=`<table><thead><tr><th>Registration</th><th>Student name</th><th>Current mark</th><th>New mark</th><th>Status</th></tr></thead><tbody>${r.map(x=>`<tr><td class="mono">${esc(x.reg_no)}</td><td>${esc(x.name)}</td><td>${x.score??'—'}</td><td><input type="number" min="0" max="${window.assessmentRows.find(a=>a.id===Number($('#bassess').value)).max_score}" step=".1" data-id="${x.id}" value="${x.score??''}"></td><td><span class="status">Ready</span></td></tr>`).join('')}</tbody></table>`}
async function saveBatch(){let marks=[...document.querySelectorAll('#batchTable input')].filter(x=>x.value!=='').map(x=>({student_id:Number(x.dataset.id),score:x.value}));try{await api('/api/batch',{assessment_id:$('#bassess').value,marks});toast(`Saved ${marks.length} marks.`)}catch(e){toast(e.message)}}
function verifyPage(){let p=appData.pending;return `<div class="welcome"><div><div class="eyebrow">Faculty review</div><h1>Verification queue</h1><p class="muted">Approve student reported marks before they enter class analytics.</p></div><span class="status amber">${p.length} pending</span></div>${p.length?p.map(x=>`<div class="card course"><div class="course-head"><div><div class="eyebrow">${esc(x.code)} · ${esc(x.assessment)}</div><h3>${esc(x.student)} <span class="mono muted">${esc(x.reg_no)}</span></h3></div><span class="chip">${esc(x.status)}</span></div><p>Submitted score <strong class="mono">${x.score}</strong> · ${esc(x.reason)}</p><div class="inline"><button class="btn primary" onclick="review(${x.id},'approve')">Approve</button><button class="btn" onclick="review(${x.id},'reject')">Reject</button></div></div>`).join(''):'<div class="card"><h3>All caught up</h3><p class="muted">No student reported marks need review.</p></div>'}`}
async function risksPage(){let risk=await api('/api/risks');return `<div class="welcome"><div><div class="eyebrow">Early support signals</div><h1>At-risk students</h1><p class="muted">Attendance below 75% is flagged for a faculty check-in.</p></div></div>${risk.length?`<div class="card table-wrap"><table><thead><tr><th>Student</th><th>Registration</th><th>Slot</th><th>Overall Z</th><th>Attendance</th><th>Risk reason</th><th></th></tr></thead><tbody>${risk.map(x=>`<tr><td>${esc(x.name)}</td><td class="mono">${esc(x.reg_no)}</td><td>${esc(x.slot)}</td><td class="mono">${x.z??'?'}</td><td class="${x.attendance<75?'amber':'green'}">${x.attendance}%</td><td>${esc(x.reason)}</td><td><button class="btn" onclick="sendAlert(${x.id})">Send guidance alert</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card">No at-risk students found.</div>'}`}
async function review(id,action){try{await api('/api/review',{submission_id:id,action});toast('Review saved.');appData=await api('/api/dashboard');renderApp()}catch(e){toast(e.message)}}async function sendAlert(id){try{await api('/api/alert',{student_id:id,message:'Faculty guidance check-in'});toast('Guidance alert recorded.')}catch(e){toast(e.message)}}async function logout(){await api('/api/logout',{});home()}async function home(){$('#root').innerHTML=landing()} (async()=>{let m=await api('/api/me').catch(()=>({}));if(m.user)boot();else home()})();
</script></body></html>
